<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Администрирование записей</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="section"><p class="eyebrow">Администрирование</p><h1>Записи клиентов</h1><p class="muted">Для доступа нужен bearer-токен администратора из API.</p><form id="login"><label>Токен<input id="token" type="password" required></label><button class="button" type="submit">Загрузить записи</button></form><div id="message" class="form-message"></div><div id="bookings" class="grid"></div></main><script>const api=(a,o={})=>fetch('/api/index.php?action='+a,{headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('admin_token')},...o}).then(r=>r.json()).then(x=>{if(!x.ok)throw Error(x.error.message);return x.data});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const rows=await api('admin.bookings');document.querySelector('#bookings').innerHTML=rows.map(b=>`<article class="card"><h3>${esc(b.service_name)}</h3><p>${esc(b.first_name)} ${esc(b.last_name)} · ${esc(b.email)}</p><p>${esc(b.starts_at)} · ${esc(b.master_name)}</p><select data-id="${b.id}">${['pending','confirmed','completed','cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></article>`).join('');document.querySelectorAll('[data-id]').forEach(x=>x.onchange=async()=>{await api('admin.booking.status',{method:'POST',body:JSON.stringify({booking_id:x.dataset.id,status:x.value})})})}document.querySelector('#login').onsubmit=async e=>{e.preventDefault();localStorage.setItem('admin_token',document.querySelector('#token').value);try{await load();document.querySelector('#login').hidden=true}catch(err){document.querySelector('#message').textContent=err.message}};</script></body></html>
